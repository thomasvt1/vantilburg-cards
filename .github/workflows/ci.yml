name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:examples
      - run: npm test
      - name: Cache Bubble Card fixture
        uses: actions/cache@v4
        with:
          path: .cache/bubble-card.js
          key: bubble-card-${{ hashFiles('scripts/fetch-bubble.mjs') }}
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell
      - name: Install headless Chromium
        run: npx playwright install --only-shell chromium
        timeout-minutes: 2
      - run: npm run test:browser
      - run: npm run update:examples
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            examples/*.png
            .vitest/attachments/
          retention-days: 14
