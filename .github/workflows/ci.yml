name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:examples
      - run: npm test
      - name: Install headless Chromium
        run: npx playwright install --only-shell chromium
        timeout-minutes: 2
      - run: npm run test:browser
      - run: npm run update:examples
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            examples/*.png
            .vitest/attachments/
          retention-days: 14
